# Application Configuration
spring.application.name=ice-arena

# Database Configuration
# Lokal: H2 fayl bazası. Deploy zamanı DB_URL / DB_USERNAME / DB_PASSWORD
# mühit dəyişənləri verilərsə (məs. PostgreSQL), onlardan istifadə olunur.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ice_arena_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=IceArenaSecretKeyForJWTTokenGenerationMustBeVeryLongAndSecure12345678901234567890
jwt.expiration=86400000

# Server Configuration
server.port=${PORT:8080}

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
